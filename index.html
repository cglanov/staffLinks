<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAEE Staff Links</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root {
      --purple-dark: #4c1d95;
      --purple-primary: #6d28d9;
      --purple-accent: #7c3aed;
      --purple-light: #f3e8ff;
      --purple-border: #ddd6fe;
      --white: #ffffff;
      --text-dark: #1e1b4b;
      --text-muted: #5b21b6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scrollbar-gutter: stable;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--white);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Banner */
    header.banner {
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple-primary) 100%);
      color: var(--white);
      padding: clamp(1rem, 2.6vh, 2rem) 1.5rem;
      text-align: center;
      box-shadow: 0 4px 12px rgba(76, 29, 149, 0.18);
      flex-shrink: 0;
    }

    header.banner h1 {
      font-size: clamp(1.5rem, 3.5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    /* Main Container */
    main {
      width: 100%;
      margin: 0 auto;
      padding: clamp(0.85rem, 2vh, 1.75rem) clamp(0.85rem, 2vw, 2rem);
      flex: 1;
    }

    /* Dynamic Button Grid */
    .links-grid {
      --btn-height: 112px;
      --grid-gap: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--grid-gap);
      align-content: start;
    }

    /* Dynamically Sized Link Buttons */
    .link-btn {
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: clamp(0.5rem, calc(var(--btn-height) * 0.11), 1.1rem);
      height: var(--btn-height);
      background-color: var(--white);
      border: 2px solid var(--purple-primary);
      border-radius: clamp(9px, calc(var(--btn-height) * 0.11), 14px);
      padding: 0 clamp(0.65rem, calc(var(--btn-height) * 0.14), 1.25rem) 0 5px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(109, 40, 217, 0.08);
      transition: transform 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .link-btn:hover,
    .link-btn:focus-visible {
      z-index: 20;
      background-color: var(--purple-primary);
      border-color: var(--purple-dark);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(109, 40, 217, 0.22);
      outline: none;
    }

    /* Dominant Left Icon (90% of button height) */
    .link-icon-wrap {
      height: 90%;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--white);
      border: 1px solid var(--purple-border);
      border-radius: clamp(6px, calc(var(--btn-height) * 0.08), 10px);
      padding: 4px;
      overflow: hidden;
    }

    .link-icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Button Text Stack */
    .link-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      height: 100%;
      padding: clamp(4px, calc(var(--btn-height) * 0.07), 10px) 0;
      overflow: hidden;
    }

    .link-label {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--purple-dark);
      line-height: 1.22;
      overflow-wrap: break-word;
      transition: color 0.16s ease;
    }

    .link-desc {
      margin-top: clamp(2px, calc(var(--btn-height) * 0.045), 6px);
      font-size: 0.925rem;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.35;
      overflow-wrap: break-word;
      transition: color 0.16s ease;
    }

    .link-btn:hover .link-label,
    .link-btn:focus-visible .link-label,
    .link-btn:hover .link-desc,
    .link-btn:focus-visible .link-desc {
      color: var(--white);
    }

    /* Hover Tooltip for Truncated Text */
    .link-tooltip {
      position: absolute;
      left: -2px;
      right: -2px;
      top: calc(100% + 8px);
      z-index: 50;
      background-color: var(--text-dark);
      color: var(--white);
      border: 2px solid var(--purple-primary);
      border-radius: 10px;
      padding: 0.75rem 0.95rem;
      box-shadow: 0 12px 28px rgba(30, 27, 75, 0.28);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s ease;
      pointer-events: none;
    }

    .link-tooltip.tooltip-above {
      top: auto;
      bottom: calc(100% + 8px);
      transform: translateY(4px);
    }

    .link-btn.has-overflow:hover .link-tooltip,
    .link-btn.has-overflow:focus-visible .link-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .link-tooltip-title {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--purple-border);
      margin-bottom: 0.25rem;
    }

    .link-tooltip-desc {
      display: block;
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.45;
      color: var(--white);
    }

    /* Status & Error States */
    .status-box {
      max-width: 720px;
      margin: 2rem auto 0;
      text-align: center;
      padding: 3rem 1.5rem;
      border: 2px dashed var(--purple-border);
      border-radius: 12px;
      background-color: var(--purple-light);
      color: var(--purple-dark);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid var(--purple-border);
      border-top-color: var(--purple-primary);
      border-radius: 50%;
      margin: 0 auto 1rem;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header class="banner">
    <h1>AAEE Staff Links</h1>
  </header>

  <main>
    <div id="status" class="status-box">
      <div class="spinner"></div>
      Loading links...
    </div>
    <div id="links-container" class="links-grid" hidden></div>
  </main>

  <script>
    const SHEET_ID = "1A9OR5yTFmVAqRJSvpMpNK37Xg1VUA7PO3D7hpJUaIiw";
    const GID = "0";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

    // Dynamic button sizing limits (adjust these to change when buttons stop shrinking and start spilling)
    const LAYOUT_CONFIG = {
      minWidth: 220,        // Minimum button width (px) before wrapping to fewer columns
      minHeight: 76,        // Minimum button height (px) before spilling into scrollable rows below
      maxHeight: 165,       // Maximum button height (px) when there are only a few buttons
      maxHeightRatio: 0.42, // Caps button height relative to width so the square icon never crowds out text
      minGap: 10,           // Minimum grid gap (px)
      maxGap: 20            // Maximum grid gap (px)
    };

    // RFC-4180 compliant CSV parser (handles commas and line breaks inside quoted cells)
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (inQuotes) {
          if (char === '"' && nextChar === '"') {
            cell += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            cell += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ",") {
            row.push(cell.trim());
            cell = "";
          } else if (char === "\r" && nextChar === "\n") {
            row.push(cell.trim());
            rows.push(row);
            row = [];
            cell = "";
            i++;
          } else if (char === "\n" || char === "\r") {
            row.push(cell.trim());
            rows.push(row);
            row = [];
            cell = "";
          } else {
            cell += char;
          }
        }
      }

      if (cell.length > 0 || row.length > 0) {
        row.push(cell.trim());
        rows.push(row);
      }

      return rows;
    }

    function normalizeUrl(rawUrl) {
      const trimmed = rawUrl.trim();
      if (!trimmed) return null;
      if (/^javascript:/i.test(trimmed)) return null;
      if (/^(https?:\/\/|mailto:|tel:|\/)/i.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    }

    function extractDriveFileId(rawUrl) {
      const normalized = normalizeUrl(rawUrl);
      if (!normalized) return null;
      const match = normalized.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=[^&]+&)?id=)([a-zA-Z0-9_-]+)/i);
      return match ? match[1] : null;
    }

    function normalizeImageUrl(rawUrl) {
      const normalized = normalizeUrl(rawUrl);
      if (!normalized || /^(mailto:|tel:)/i.test(normalized)) return null;

      // Serve the original Google Drive image directly so PNG alpha transparency is preserved
      const driveId = extractDriveFileId(normalized);
      if (driveId) {
        return `https://lh3.googleusercontent.com/d/${driveId}`;
      }

      return normalized;
    }

    function updateGridLayout(containerEl) {
      const buttons = containerEl.querySelectorAll(".link-btn");
      const count = buttons.length;
      if (count === 0) return;

      const mainEl = containerEl.parentElement;
      const headerEl = document.querySelector("header.banner");
      const mainStyle = getComputedStyle(mainEl);

      const padX = (parseFloat(mainStyle.paddingLeft) || 0) + (parseFloat(mainStyle.paddingRight) || 0);
      const padY = (parseFloat(mainStyle.paddingTop) || 0) + (parseFloat(mainStyle.paddingBottom) || 0);
      const headerHeight = headerEl ? headerEl.getBoundingClientRect().height : 0;

      const availW = Math.max(LAYOUT_CONFIG.minWidth, mainEl.clientWidth - padX);
      const availH = Math.max(LAYOUT_CONFIG.minHeight, window.innerHeight - headerHeight - padY);

      // Scale gap softly with viewport size
      const gap = Math.round(
        Math.max(LAYOUT_CONFIG.minGap, Math.min(LAYOUT_CONFIG.maxGap, Math.min(availW, availH) * 0.02))
      );

      const maxCols = Math.max(
        1,
        Math.min(count, Math.floor((availW + gap) / (LAYOUT_CONFIG.minWidth + gap)))
      );

      let bestLayout = null;

      // Find the best column/row arrangement that fits completely within the viewport
      for (let cols = 1; cols <= maxCols; cols++) {
        const rows = Math.ceil(count / cols);
        const btnW = (availW - (cols - 1) * gap) / cols;
        const maxRowH = (availH - (rows - 1) * gap) / rows;

        // Skip layouts that would force buttons below the minimum height limit
        if (maxRowH < LAYOUT_CONFIG.minHeight) continue;

        const btnH = Math.min(
          maxRowH,
          LAYOUT_CONFIG.maxHeight,
          btnW * LAYOUT_CONFIG.maxHeightRatio
        );

        if (btnH < LAYOUT_CONFIG.minHeight) continue;

        // Favor taller, well-proportioned cards over overly wide, skinny strips
        const score = btnH * Math.min(btnW, btnH * 3.4);

        if (!bestLayout || score > bestLayout.score) {
          bestLayout = { cols, btnH, score };
        }
      }

      // If no layout fits above the minimum size, lock at minimum height and spill into extra rows
      const chosenCols = bestLayout ? bestLayout.cols : maxCols;
      const chosenHeight = Math.floor(bestLayout ? bestLayout.btnH : LAYOUT_CONFIG.minHeight);

      containerEl.style.setProperty("--grid-gap", `${gap}px`);
      containerEl.style.setProperty("--btn-height", `${chosenHeight}px`);
      containerEl.style.gridTemplateColumns = `repeat(${chosenCols}, minmax(0, 1fr))`;

      fitAllButtons(containerEl);
    }

    function fitButtonText(anchor) {
      const contentEl = anchor.querySelector(".link-content");
      const labelEl = anchor.querySelector(".link-label");
      const descEl = anchor.querySelector(".link-desc");
      const tooltipEl = anchor.querySelector(".link-tooltip");

      if (!contentEl || !labelEl) return;

      // Scale font-size targets proportionally to the button's current dynamic height
      const btnHeight = anchor.clientHeight || 112;
      const scale = btnHeight / 112;

      const DEFAULT_LABEL_SIZE = Math.max(15, Math.min(26, 20 * scale));
      const MIN_LABEL_SIZE = Math.max(13, Math.min(18, 15.5 * scale));
      const DEFAULT_DESC_SIZE = Math.max(12, Math.min(18, 14.8 * scale));
      const MIN_DESC_SIZE = Math.max(10.5, Math.min(14, 12 * scale));

      // Reset styles to defaults before measuring
      labelEl.style.fontSize = `${DEFAULT_LABEL_SIZE}px`;
      labelEl.style.display = "";
      labelEl.style.webkitLineClamp = "";
      labelEl.style.webkitBoxOrient = "";
      labelEl.style.overflow = "";

      if (descEl) {
        descEl.style.fontSize = `${DEFAULT_DESC_SIZE}px`;
        descEl.style.display = "";
        descEl.style.webkitLineClamp = "";
        descEl.style.webkitBoxOrient = "";
        descEl.style.overflow = "";
      }

      anchor.classList.remove("has-overflow");
      if (tooltipEl) tooltipEl.hidden = true;

      const contentStyle = getComputedStyle(contentEl);
      const padTop = parseFloat(contentStyle.paddingTop) || 0;
      const padBottom = parseFloat(contentStyle.paddingBottom) || 0;
      const maxTextHeight = contentEl.clientHeight - padTop - padBottom;
      const maxTextWidth = contentEl.clientWidth;

      const overflows = () => {
        let totalHeight = labelEl.offsetHeight;
        let widest = labelEl.scrollWidth;

        if (descEl) {
          const descMarginTop = parseFloat(getComputedStyle(descEl).marginTop) || 0;
          totalHeight += descMarginTop + descEl.offsetHeight;
          widest = Math.max(widest, descEl.scrollWidth);
        }

        return totalHeight > maxTextHeight + 0.5 || widest > maxTextWidth + 1;
      };

      // 1. Default sizes fit cleanly
      if (!overflows()) return;

      // 2. Dynamically shrink text sizes to fit within the button height
      let labelSize = DEFAULT_LABEL_SIZE;
      let descSize = DEFAULT_DESC_SIZE;
      let fits = false;

      while (labelSize > MIN_LABEL_SIZE || (descEl && descSize > MIN_DESC_SIZE)) {
        if (descEl && descSize > MIN_DESC_SIZE) {
          descSize = Math.max(MIN_DESC_SIZE, descSize - 0.5);
          descEl.style.fontSize = `${descSize}px`;
        }
        if (!overflows()) {
          fits = true;
          break;
        }
        if (labelSize > MIN_LABEL_SIZE) {
          labelSize = Math.max(MIN_LABEL_SIZE, labelSize - 0.5);
          labelEl.style.fontSize = `${labelSize}px`;
        }
        if (!overflows()) {
          fits = true;
          break;
        }
      }

      if (fits) return;

      // 3. Text is still too long: revert to scaled default size and truncate with '...'
      labelEl.style.fontSize = `${DEFAULT_LABEL_SIZE}px`;

      if (descEl) {
        descEl.style.fontSize = `${DEFAULT_DESC_SIZE}px`;

        const labelLineHeight = parseFloat(getComputedStyle(labelEl).lineHeight) || DEFAULT_LABEL_SIZE * 1.22;
        const maxLabelLines = btnHeight < 90 ? 1 : 2;
        if (labelEl.offsetHeight > labelLineHeight * maxLabelLines + 2) {
          labelEl.style.display = "-webkit-box";
          labelEl.style.webkitBoxOrient = "vertical";
          labelEl.style.webkitLineClamp = String(maxLabelLines);
          labelEl.style.overflow = "hidden";
        }

        const descMarginTop = parseFloat(getComputedStyle(descEl).marginTop) || 0;
        const availableDescHeight = maxTextHeight - labelEl.offsetHeight - descMarginTop;
        const descLineHeight = parseFloat(getComputedStyle(descEl).lineHeight) || DEFAULT_DESC_SIZE * 1.35;
        const maxDescLines = Math.max(1, Math.floor((availableDescHeight + 1) / descLineHeight));

        descEl.style.display = "-webkit-box";
        descEl.style.webkitBoxOrient = "vertical";
        descEl.style.webkitLineClamp = String(maxDescLines);
        descEl.style.overflow = "hidden";
      } else {
        const labelLineHeight = parseFloat(getComputedStyle(labelEl).lineHeight) || DEFAULT_LABEL_SIZE * 1.22;
        const maxLabelLines = Math.max(1, Math.floor((maxTextHeight + 1) / labelLineHeight));
        labelEl.style.display = "-webkit-box";
        labelEl.style.webkitBoxOrient = "vertical";
        labelEl.style.webkitLineClamp = String(maxLabelLines);
        labelEl.style.overflow = "hidden";
      }

      anchor.classList.add("has-overflow");
      if (tooltipEl) tooltipEl.hidden = false;
    }

    function fitAllButtons(containerEl) {
      containerEl.querySelectorAll(".link-btn").forEach(fitButtonText);
    }

    function updateTooltipPlacement(anchor) {
      const tooltipEl = anchor.querySelector(".link-tooltip");
      if (!tooltipEl || tooltipEl.hidden) return;
      const rect = anchor.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      const spaceAbove = rect.top;
      tooltipEl.classList.toggle("tooltip-above", spaceBelow < 160 && spaceAbove > spaceBelow);
    }

    async function loadLinks() {
      const statusEl = document.getElementById("status");
      const containerEl = document.getElementById("links-container");

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) {
          throw new Error(`HTTP error ${response.status}`);
        }

        const csvText = await response.text();
        const rows = parseCSV(csvText);

        // Skip row 1 (index 0) and filter out rows missing a label (Col A) or URL (Col B)
        const dataRows = rows.slice(1).filter(row => row[0] && row[1]);

        if (dataRows.length === 0) {
          statusEl.textContent = "No links found in the spreadsheet after row 1.";
          return;
        }

        dataRows.forEach(row => {
          const labelText = row[0];
          const url = normalizeUrl(row[1]);
          const descriptionText = row[2] || "";
          const rawIconUrl = row[3] || "";
          const iconSrc = normalizeImageUrl(rawIconUrl);

          if (!url) return;

          const anchor = document.createElement("a");
          anchor.className = "link-btn";
          anchor.href = url;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";

          if (iconSrc) {
            const iconWrap = document.createElement("div");
            iconWrap.className = "link-icon-wrap";

            const img = document.createElement("img");
            img.className = "link-icon";
            img.src = iconSrc;
            img.alt = "";
            img.loading = "lazy";

            const driveId = extractDriveFileId(rawIconUrl);
            const fallbackSrc = driveId
              ? `https://drive.google.com/thumbnail?id=${driveId}&sz=w256`
              : null;

            img.onerror = () => {
              if (fallbackSrc && img.src !== fallbackSrc) {
                img.src = fallbackSrc;
                return;
              }
              iconWrap.remove();
              fitButtonText(anchor);
            };

            iconWrap.appendChild(img);
            anchor.appendChild(iconWrap);
          }

          const contentEl = document.createElement("div");
          contentEl.className = "link-content";

          const labelEl = document.createElement("span");
          labelEl.className = "link-label";
          labelEl.textContent = labelText;
          contentEl.appendChild(labelEl);

          if (descriptionText) {
            const descEl = document.createElement("span");
            descEl.className = "link-desc";
            descEl.textContent = descriptionText;
            contentEl.appendChild(descEl);
          }

          anchor.appendChild(contentEl);

          // Tooltip element (shown on hover/focus only when text is truncated)
          const tooltipEl = document.createElement("div");
          tooltipEl.className = "link-tooltip";
          tooltipEl.setAttribute("role", "tooltip");
          tooltipEl.hidden = true;

          const tooltipTitle = document.createElement("span");
          tooltipTitle.className = "link-tooltip-title";
          tooltipTitle.textContent = labelText;
          tooltipEl.appendChild(tooltipTitle);

          if (descriptionText) {
            const tooltipDesc = document.createElement("span");
            tooltipDesc.className = "link-tooltip-desc";
            tooltipDesc.textContent = descriptionText;
            tooltipEl.appendChild(tooltipDesc);
          }

          anchor.appendChild(tooltipEl);

          anchor.addEventListener("mouseenter", () => updateTooltipPlacement(anchor));
          anchor.addEventListener("focus", () => updateTooltipPlacement(anchor));

          containerEl.appendChild(anchor);
        });

        statusEl.hidden = true;
        containerEl.hidden = false;
        updateGridLayout(containerEl);

        // Recompute grid dimensions and text fitting whenever viewport width or height changes
        let resizeRaf = null;
        window.addEventListener("resize", () => {
          if (resizeRaf) cancelAnimationFrame(resizeRaf);
          resizeRaf = requestAnimationFrame(() => updateGridLayout(containerEl));
        });
      } catch (error) {
        console.error("Failed to load Google Sheet:", error);
        statusEl.innerHTML = `
          <strong>Unable to load links from Google Sheets.</strong><br>
          Make sure the spreadsheet sharing setting is set to <em>"Anyone with the link" (Viewer)</em>.
        `;
      }
    }

    loadLinks();
  </script>
</body>
</html>
